baseURL = '/'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'Amigo'
uglyURLs = true

[permalinks]
  posts = "/:filename"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  name = "关于"
  url = "/about.html"
  weight = 2

[[menu.main]]
  name = "友链"
  url = "/friends.html"
  weight = 3

[params]
  # ---------------------------------------------------------------------------------------
  # 个人信息设置
  # ---------------------------------------------------------------------------------------
  username = "SL"

  # 头像地址（可以放本地路径比如 "/images/avatar.jpg"，也可以放网图链接）
  avatar = "/images/avatar.jpg"

  # 个人简介，会显示在头像旁边
  description = "记录生活朋友圈"

  # 首页最上面那张大图
  # cover = "/images/header.png"

  # ---------------------------------------------------------------------------------------
  # 网站全局设置
  # ---------------------------------------------------------------------------------------
  favicon = "favicon.ico"

  # 页面最底部的文字，支持写 HTML 代码
  footerText = "© 2026 Designed by Amigo"

  # ICP 备案号，要是没有就注掉
  # icp = "京ICP备12345678号"

  # ---------------------------------------------------------------------------------------
  # 评论系统设置
  # ---------------------------------------------------------------------------------------
  # 评论模式：选 "artalk"、"twikoo"、"giscus" 或者 "none"（关掉评论）
  commentMode = "none"

  # 首页顶部封面：可以是图片或视频
  headerMedia = "https://cdn.jsdelivr.net/gh/q3190872366/amigo-blog@master/themes/Amigo/static/videos/2792755201.mp4"

  # ---------------------------------------------------------------------------------------
  # 字体设置
  # ---------------------------------------------------------------------------------------
  fontFamily = "ZQL"

  # ---------------------------------------------------------------------------------------
  # 功能开关
  # ---------------------------------------------------------------------------------------
  enablePjax = true
  enableLightbox = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4
