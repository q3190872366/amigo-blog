<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>发布动态 - 鹈鹕博客后台</title>
<script src="head-init.js"></script>
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="moments.css">
</head>
<body>

<div class="mom-app">
  <!-- 顶部栏 -->
  <header class="mom-top">
    <button class="mom-cancel" onclick="cancelMoment()">取消</button>
    <span class="mom-title">动态</span>
    <button class="mom-publish" id="mom-publish" onclick="publishMoment()" disabled>发表</button>
  </header>

  <!-- 工具栏 -->
  <div class="mom-tb">
    <button onclick="doFmt('undo')" title="撤销 Ctrl+Z">↶</button>
    <button onclick="doFmt('redo')" title="重做 Ctrl+Y">↷</button>
    <span class="sep"></span>
    <button onclick="doFmt('bold')" title="粗体 Ctrl+B"><b>B</b></button>
    <button onclick="doFmt('italic')" title="斜体 Ctrl+I"><i>I</i></button>
    <button onclick="doFmt('underline')" title="下划线"><u>U</u></button>
    <button onclick="doFmt('strike')" title="删除线"><s>S</s></button>
    <span class="sep"></span>
    <button onclick="doFmt('h')" title="标签">#</button>
    <button onclick="doFmt('link')" title="链接">🔗</button>
    <button onclick="doFmt('emoji')" title="表情">😊</button>
  </div>

  <!-- 正文 -->
  <div class="mom-body">
    <textarea id="mom-text" placeholder="这一刻的想法..." oninput="onText()" maxlength="2000"></textarea>
    <div class="mom-meta">
      <span class="mom-cnt" id="mom-cnt">0 / 2000</span>
      <select id="mom-topic" class="mom-topic">
        <option value="">选择话题（可选）</option>
      </select>
    </div>
  </div>

  <!-- 图片区域 -->
  <div class="mom-images">
    <div class="mom-img-tabs">
      <span class="mom-img-tab on" data-tab="normal" onclick="swMomImgTab('normal')">📷 普通图片</span>
      <span class="mom-img-tab" data-tab="real" onclick="swMomImgTab('real')">🖼 真实图片</span>
      <span class="mom-img-tab" data-tab="live" onclick="swMomImgTab('live')">🎞 实况图</span>
      <span class="mom-img-tab" data-tab="video" onclick="swMomImgTab('video')">🎬 短视频</span>
    </div>
    <div class="mom-img-list" id="mom-img-list">
      <div class="mom-img-add" id="mom-img-add" onclick="document.getElementById('mom-img-file').click()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </div>
      <div class="mom-img-hint" id="mom-img-hint">点击添加图片</div>
    </div>
    <input type="file" id="mom-img-file" accept="image/*" multiple style="display:none" onchange="momImgUpload(this.files)">
    <input type="file" id="mom-live-file" accept="image/*,video/*" multiple style="display:none" onchange="momLiveUpload(this.files)">
    <input type="file" id="mom-video-file" accept="video/*" multiple style="display:none" onchange="momVideoUpload(this.files)">
  </div>

  <!-- 附加操作 -->
  <div class="mom-actions">
    <div class="mom-action" onclick="openMomLib()">
      <span>📷 从媒体库导入</span>
      <span class="arr">›</span>
    </div>
    <div class="mom-action" onclick="alert('所在位置：开发中')">
      <span>📍 所在位置</span>
      <span class="arr">›</span>
    </div>
    <div class="mom-action" onclick="alert('添加音乐：开发中')">
      <span>🎵 添加音乐</span>
      <span class="arr">›</span>
    </div>
  </div>

  <!-- 状态 -->
  <div class="mom-status" id="mom-status"></div>
</div>

<!-- 媒体库选择器 -->
<div class="mom-lib" id="mom-lib">
  <div class="mom-lib-bg" onclick="closeMomLib()"></div>
  <div class="mom-lib-bd">
    <div class="mom-lib-h">
      <span>从媒体库选择</span>
      <button onclick="closeMomLib()">✕</button>
    </div>
    <div class="mom-lib-search">
      <input type="text" id="mom-lib-q" placeholder="搜索文件名..." oninput="filterMomLib()">
      <button onclick="refreshMomLib()">↻ 刷新</button>
    </div>
    <div class="mom-lib-grid" id="mom-lib-grid">
      <div class="empty" style="grid-column:1/-1;padding:20px;text-align:center;color:var(--m)">加载中...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="admin-core.js"></script>
<script src="moments.js"></script>
</body>
</html>
