{{ $src := .Get "src" | default "" }}
{{ $video := .Get "video" | default "" }}
{{ $caption := .Get "caption" | default "" }}

<div class="live-card live-photo is-muted" data-video="{{ $video }}" data-alt="{{ $caption }}">
    <div class="live-card-container">
        {{ if $src }}
        <img class="live-card-img live-photo-poster" src="{{ $src }}" alt="{{ $caption }}" loading="lazy" data-keep="1">
        {{ end }}
        {{ if $video }}
        <video class="live-photo-video" data-src="{{ $video }}" muted playsinline preload="metadata" aria-hidden="true"></video>
        {{ end }}
        <div class="live-photo-badge">
            <svg class="live-photo-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="5"/>
                <path d="M15.9 20.11l0 .01"/>
                <path d="M19.04 17.61l0 .01"/>
                <path d="M20.77 14l0 .01"/>
                <path d="M20.77 10l0 .01"/>
                <path d="M19.04 6.39l0 .01"/>
                <path d="M15.9 3.89l0 .01"/>
                <path d="M12 3l0 .01"/>
                <path d="M8.1 3.89l0 .01"/>
                <path d="M4.96 6.39l0 .01"/>
                <path d="M3.23 10l0 .01"/>
                <path d="M3.23 14l0 .01"/>
                <path d="M4.96 17.61l0 .01"/>
                <path d="M8.1 20.11l0 .01"/>
                <path d="M12 21l0 .01"/>
            </svg>
            <span>实况</span>
        </div>
        <button type="button" class="live-photo-mute-btn" aria-label="切换声音" data-muted="true">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
        </button>
    </div>
    {{ if $caption }}
    <div class="live-card-caption">
        {{ $caption }}
    </div>
    {{ end }}
</div>
